title: Nerd061 Blog
description: "这里是 @Nerd061 的个人网站，用于记录个人科研内容"
url: "https://Nerd061.github.io"
baseurl: ""
lang: zh-CN

notes_folders:
  - 网站指南
  - 学习笔记

collections:
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: notes

markdown: kramdown
kramdown:
  input: GFM
exclude:
  - LICENSE
